global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: mundo-manitas-api
    metrics_path: /actuator/prometheus
    scheme: http
    basic_auth:
      username: monitor
      password_file: /etc/prometheus/secrets/monitor_password
    static_configs:
      - targets: ['127.0.0.1:8080']
        labels:
          service: mundo-manitas-api
