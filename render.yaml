# Despliegue gratuito en Render: app Docker + Postgres free.
# Se aplica desde el dashboard: New > Blueprint > elegir este repositorio.
#
# Límites del plan free (importante):
# - La app se apaga a los 15 min sin tráfico y tarda ~1 min en despertar.
# - No hay disco persistente: los archivos subidos (avatares, portadas, PDFs)
#   se pierden en cada redeploy, reinicio o apagado.
# - El Postgres free expira a los 30 días; después hay 14 días de gracia y se borra.
databases:
  - name: manitas-db
    databaseName: mundo_manitas_api
    user: mundo_manitas
    postgresMajorVersion: "18"
    plan: free
    region: oregon

services:
  - type: web
    name: manitas-academy
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Render entrega la URL interna de la base; el entrypoint la vuelve JDBC.
      - key: DATABASE_URL
        fromDatabase:
          name: manitas-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: manitas-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: manitas-db
          property: password

      # Clave de la cuenta administradora. Render la pide al crear el Blueprint
      # y nunca queda escrita en el repositorio.
      - key: ADMIN_PASSWORD
        sync: false

      # Clave de firma de "recordarme"; se genera sola y no se comparte.
      - key: REMEMBER_ME_KEY
        generateValue: true

      # URL pública del servicio, para los enlaces de los correos.
      # Formato: https://TU-SERVICIO.onrender.com
      - key: APP_BASE_URL
        sync: false

      # Los archivos viven en el filesystem efímero del contenedor.
      - key: AVATARS_DIR
        value: /app/uploads/avatars
      - key: COVERS_DIR
        value: /app/uploads/covers
      - key: MATERIALS_DIR
        value: /app/uploads/materials
      - key: LOG_FILE
        value: /app/logs/mundomanitas.log

      # Memoria del JVM dentro de los 512 MB del plan free.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=65 -Dfile.encoding=UTF-8

      # Opcionales (RESEND_API_KEY, STRIPE_*, MONITOR_*): se agregan a mano
      # desde el dashboard cuando se quieran activar correos o cobros.
