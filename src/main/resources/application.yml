spring:
  application:
    name: api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mundo_manitas_api}
    username: ${DB_USER:mundo_manitas}
    password: ${DB_PASSWORD:mundo_manitas}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
