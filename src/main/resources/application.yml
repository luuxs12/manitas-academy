spring:
  application:
    name: api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mundo_manitas_api}
    username: ${DB_USER:mundo_manitas}
    password: ${DB_PASSWORD:mundo_manitas}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  # Render inyecta PORT; en local sigue siendo 8080.
  port: ${PORT:8080}
  # Detrás del proxy de Render, respeta X-Forwarded-* para generar enlaces https.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax

app:
  admin:
    email: ${ADMIN_EMAIL:admin@damianprint.com}
    password: ${ADMIN_PASSWORD:}
  security:
    remember-me-key: ${REMEMBER_ME_KEY:mundo-manitas-dev-key}
  rate-limit:
    max-attempts: ${RATE_LIMIT_MAX_ATTEMPTS:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
  monitoring:
    # Sin contraseña, Actuator queda protegido con la cuenta ADMIN del sitio.
    username: ${MONITOR_USER:monitor}
    password: ${MONITOR_PASSWORD:}
  mail:
    # Sin clave, el correo se omite y el sitio sigue funcionando.
    api-key: ${RESEND_API_KEY:}
    from: "${MAIL_FROM:Mundo Manitas <onboarding@resend.dev>}"
    base-url: ${APP_BASE_URL:http://localhost:8080}
    endpoint: ${RESEND_ENDPOINT:https://api.resend.com}
    reset-minutes: ${RESET_MINUTES:60}
  stripe:
    # Sin clave o sin price ids, el cobro aparece como no disponible.
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    monthly-price-id: ${STRIPE_MONTHLY_PRICE_ID:}
    annual-price-id: ${STRIPE_ANNUAL_PRICE_ID:}
    endpoint: ${STRIPE_ENDPOINT:https://api.stripe.com}
    api-version: ${STRIPE_API_VERSION:2026-11-18.endive}
    customer-portal-url: ${STRIPE_CUSTOMER_PORTAL_URL:}
  upload:
    avatars-dir: ${AVATARS_DIR:./uploads/avatars}
    max-avatar-bytes: ${MAX_AVATAR_BYTES:2097152}
    covers-dir: ${COVERS_DIR:./uploads/covers}
    max-cover-bytes: ${MAX_COVER_BYTES:2097152}
    materials-dir: ${MATERIALS_DIR:./uploads/materials}
    max-material-bytes: ${MAX_MATERIAL_BYTES:10485760}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: mundo-manitas-api

logging:
  level:
    root: INFO
    com.mundomanitas.api: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    software.amazon.awssdk: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/mundomanitas.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 500MB
