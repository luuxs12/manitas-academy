<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-head :: adminHead(${confirmTitle})}"></head>

<body class="panel-body admin-body">
<a class="skip-link" href="#panel-main">Saltar al contenido</a>
<div class="panel admin">
    <aside th:replace="~{admin/fragments/admin-nav :: sidebar(${active})}"></aside>
    <div class="panel-shell">
        <header th:replace="~{admin/fragments/admin-nav :: topbar(${confirmTitle}, 'Confirmación', '')}"></header>
        <main id="panel-main" class="panel-main admin-main">
            <section id="confirm-panel" class="panel-card admin-card admin-confirm-page" aria-labelledby="confirm-title">
                <h1 id="confirm-dialog-title" th:text="${confirmTitle}">Confirmar acción</h1>
                <p id="confirm-dialog-message" th:text="${confirmMessage}">Revisá los datos antes de continuar.</p>
                <ul class="admin-confirm-details"
                    th:if="${confirmDetails != null and !#lists.isEmpty(confirmDetails)}">
                    <li th:each="detail : ${confirmDetails}" th:text="${detail}"></li>
                </ul>
                <div class="admin-confirm-actions">
                    <form th:action="@{${confirmAction}}" method="post">
                        <button class="btn btn-admin admin-confirm-accept" type="submit"
                                th:text="${confirmLabel}">Confirmar</button>
                    </form>
                    <a class="admin-back" th:href="@{${cancelUrl}}" data-dialog-close>Cancelar y volver</a>
                </div>
            </section>
        </main>
    </div>
</div>
<script defer th:src="@{/js/panel.js}"></script>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
