<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-head :: adminHead(${courseId != null} ? 'Editar curso' : 'Nuevo curso')}"></head>

<body class="panel-body admin-body">
<a class="skip-link" href="#panel-main">Saltar al contenido</a>
<div class="panel admin">
    <aside th:replace="~{admin/fragments/admin-nav :: sidebar('cursos')}"></aside>
    <div class="panel-shell">
        <header th:replace="~{admin/fragments/admin-nav :: topbar('Cursos', ${courseId != null} ? 'Editar ficha' : 'Nueva ficha', '')}"></header>
        <main id="panel-main" class="panel-main admin-main">
            <p class="panel-flash panel-flash--ok" th:if="${panelOk}" th:text="${panelOk}" role="status"></p>
            <p class="panel-flash panel-flash--error" th:if="${panelError}" th:text="${panelError}" role="alert"></p>

            <div class="admin-page-head">
                <div><h1 th:text="${courseId != null} ? 'Editar curso' : 'Nuevo curso'">Curso</h1><p>Usá una portada local guardada en el servidor.</p></div>
                <a class="admin-back" th:href="@{/admin/cursos}">← Volver a cursos</a>
            </div>

            <form class="panel-card admin-card admin-form" th:action="${courseId != null} ? @{/admin/cursos/{id}(id=${courseId})} : @{/admin/cursos}"
                  th:object="${adminCourseForm}" method="post" novalidate>
                <div class="admin-form-grid">
                    <label>Título<input type="text" th:field="*{title}" maxlength="140" required>
                        <small class="admin-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small></label>
                    <label>Identificador (slug)<input type="text" th:field="*{slug}" maxlength="80" required>
                        <small class="admin-error" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></small></label>
                    <label>Nivel<input type="text" th:field="*{level}" maxlength="60" required>
                        <small class="admin-error" th:if="${#fields.hasErrors('level')}" th:errors="*{level}"></small></label>
                    <label>Categoría<input type="text" th:field="*{category}" maxlength="80" required>
                        <small class="admin-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></small></label>
                    <label>Posición<input type="number" th:field="*{position}" min="0" max="999"></label>
                    <label class="admin-span-2">Resumen<textarea th:field="*{summary}" rows="3" maxlength="400" required></textarea>
                        <small class="admin-error" th:if="${#fields.hasErrors('summary')}" th:errors="*{summary}"></small></label>
                    <label class="admin-span-2">Imagen (ruta real)<input id="course-image" type="text" th:field="*{image}" maxlength="300" required>
                        <small class="admin-error" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></small></label>
                </div>
                <label class="admin-check"><input type="checkbox" th:field="*{free}"> Curso gratuito (sin plan Premium)</label>
                <div class="admin-form-actions">
                    <button class="btn btn-admin" type="submit" th:text="${courseId != null} ? 'Guardar cambios' : 'Crear curso'">Guardar</button>
                    <a class="admin-back" th:href="@{/admin/cursos}">Cancelar</a>
                </div>
            </form>
        </main>
    </div>
</div>
<script defer th:src="@{/js/panel.js}"></script>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
