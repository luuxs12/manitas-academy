<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-head :: adminHead('Cursos')}"></head>

<body class="panel-body admin-body">
<a class="skip-link" href="#panel-main">Saltar al contenido</a>
<div class="panel admin">
    <aside th:replace="~{admin/fragments/admin-nav :: sidebar('cursos')}"></aside>
    <div class="panel-shell">
        <header th:replace="~{admin/fragments/admin-nav :: topbar('Cursos', 'Cursos del catálogo', ${query})}"></header>
        <main id="panel-main" class="panel-main admin-main">

            <div class="admin-page-head">
                <div><h1>Cursos</h1><p th:text="${page.totalElements == 1 ? '1 curso' : page.totalElements + ' cursos'}">0 cursos</p></div>
                <div class="admin-actions">
                    <a class="btn btn-admin" th:href="@{/admin/cursos/nuevo}">Nuevo curso</a>
                    <details class="admin-export"><summary>Exportar</summary><div class="panel-menu-pop">
                        <a th:href="@{/admin/exportar/cursos(formato='csv')}">CSV</a>
                        <a th:href="@{/admin/exportar/cursos(formato='xlsx')}">Excel (XLSX)</a>
                        <a th:href="@{/admin/exportar/cursos(formato='pdf')}">PDF</a>
                    </div></details>
                </div>
            </div>

            <form class="admin-filters admin-filters--full" method="get" th:action="@{/admin/cursos}">
                <label class="sr-only" for="filtro-cursos">Buscar cursos</label>
                <input id="filtro-cursos" name="q" type="search" th:value="${query}" placeholder="Título o identificador…">
                <button class="btn btn-admin" type="submit">Buscar</button>
            </form>

            <div class="panel-card admin-card admin-table-wrap">
                <table class="admin-table">
                    <caption>Cursos</caption>
                    <thead><tr><th scope="col">Curso</th><th scope="col">Categoría</th><th scope="col">Estado</th><th scope="col">Lecciones</th><th scope="col">Acceso</th><th scope="col">Inscriptos</th><th scope="col">Pos.</th><th scope="col">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="curso : ${page.content}">
                        <td>
                            <div class="admin-course-copy">
                                <strong th:text="${curso.titulo()}">Curso</strong>
                                <small th:text="${curso.slug()}">slug</small>
                            </div>
                        </td>
                        <td th:text="${curso.categoria()}">Categoría</td>
                        <td><span class="admin-status" th:classappend="${curso.status() == 'PUBLICADO'} ? ' is-ok' : ' is-bad'"
                                  th:text="${curso.status() == 'PUBLICADO'} ? 'Publicado' : 'Borrador'">Borrador</span></td>
                        <td th:text="${curso.lessons()}">0</td>
                        <td th:text="${curso.price()}">Gratis</td>
                        <td th:text="${curso.inscripto()}">0</td>
                        <td th:text="${curso.posicion()}">0</td>
                        <td class="admin-row-actions">
                            <a th:href="@{/admin/cursos/{id}/editar(id=${curso.id()})}">Editar</a>
                            <a th:href="@{/admin/cursos/{id}/contenido(id=${curso.id()})}">Contenido</a>
                            <button type="button" class="admin-confirm-link"
                                    th:attr="data-confirm-url=@{/admin/cursos/{id}/eliminar(id=${curso.id()})}, aria-label='Eliminar ' + ${curso.titulo()}">Eliminar</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.content)}"><td colspan="8" class="admin-empty">Sin cursos.</td></tr>
                    </tbody>
                </table>
            </div>
            <nav class="admin-pager" th:if="${page.totalPages > 1}" aria-label="Paginación de cursos">
                <a th:if="${!page.first}" th:href="@{/admin/cursos(page=${page.number - 1}, q=${query})}">← Anterior</a>
                <span th:text="${'Página ' + (page.number + 1) + ' de ' + page.totalPages}">Página 1</span>
                <a th:if="${!page.last}" th:href="@{/admin/cursos(page=${page.number + 1}, q=${query})}">Siguiente →</a>
            </nav>
        </main>
    </div>
</div>
<script defer th:src="@{/js/panel.js}"></script>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
