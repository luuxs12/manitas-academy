<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-head :: adminHead(${itemId != null} ? 'Editar ejercicio' : 'Nuevo ejercicio')}"></head>

<body class="panel-body admin-body">
<a class="skip-link" href="#panel-main">Saltar al contenido</a>
<div class="panel admin">
    <aside th:replace="~{admin/fragments/admin-nav :: sidebar('ejercicios')}"></aside>
    <div class="panel-shell">
        <header th:replace="~{admin/fragments/admin-nav :: topbar('Ejercicios', ${itemId != null} ? 'Editar ejercicio' : 'Nuevo ejercicio', '')}"></header>
        <main id="panel-main" class="panel-main admin-main">
            <div class="admin-page-head">
                <div><h1 th:text="${itemId != null} ? 'Editar ejercicio' : 'Nuevo ejercicio'">Ejercicio</h1><p>La consigna se guarda con el contenido del módulo.</p></div>
                <div class="admin-actions">
                    <a class="btn btn-admin" th:if="${itemId != null}"
                       th:href="@{/admin/ejercicios/{id}/preguntas(id=${itemId})}">Cargar preguntas</a>
                    <a class="admin-back" th:href="@{/admin/ejercicios}">← Volver a ejercicios</a>
                </div>
            </div>
            <form class="panel-card admin-card admin-form" th:action="${itemId != null} ? @{/admin/ejercicios/{id}(id=${itemId})} : @{/admin/ejercicios}"
                  th:object="${adminEjercicioFormulario}" method="post" novalidate>
                <div class="admin-form-grid">
                    <div class="admin-field">
                        <label for="ejercicio-modulo">Módulo</label>
                        <select id="ejercicio-modulo" th:field="*{moduloId}" required
                                th:attr="aria-invalid=${#fields.hasErrors('moduloId')} ? 'true' : null,
                                         aria-describedby=${#fields.hasErrors('moduloId')} ? 'error-ejercicio-modulo' : null">
                            <option value="">Elegí un módulo</option>
                            <option th:each="o : ${options}" th:value="${o.id()}" th:text="${o.label()}"></option>
                        </select>
                        <small id="error-ejercicio-modulo" class="admin-error" th:if="${#fields.hasErrors('moduloId')}" th:errors="*{moduloId}"></small>
                    </div>
                    <div class="admin-field">
                        <label for="ejercicio-titulo">Título</label>
                        <input id="ejercicio-titulo" type="text" th:field="*{titulo}" maxlength="140" required
                               th:attr="aria-invalid=${#fields.hasErrors('titulo')} ? 'true' : null,
                                        aria-describedby=${#fields.hasErrors('titulo')} ? 'error-ejercicio-titulo' : null">
                        <small id="error-ejercicio-titulo" class="admin-error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></small>
                    </div>
                    <div class="admin-field admin-span-2">
                        <label for="ejercicio-consigna">Consigna</label>
                        <textarea id="ejercicio-consigna" th:field="*{prompt}" rows="4" maxlength="600" required
                                  th:attr="aria-invalid=${#fields.hasErrors('prompt')} ? 'true' : null,
                                           aria-describedby=${#fields.hasErrors('prompt')} ? 'error-ejercicio-consigna' : null"></textarea>
                        <small id="error-ejercicio-consigna" class="admin-error" th:if="${#fields.hasErrors('prompt')}" th:errors="*{prompt}"></small>
                    </div>
                    <div class="admin-field">
                        <label for="ejercicio-posicion">Posición</label>
                        <input id="ejercicio-posicion" type="number" th:field="*{posicion}" min="0" max="9999"
                               th:attr="aria-invalid=${#fields.hasErrors('posicion')} ? 'true' : null,
                                        aria-describedby=${#fields.hasErrors('posicion')} ? 'error-ejercicio-posicion' : null">
                        <small id="error-ejercicio-posicion" class="admin-error" th:if="${#fields.hasErrors('posicion')}" th:errors="*{posicion}"></small>
                    </div>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-admin" type="submit" th:text="${itemId != null} ? 'Guardar cambios' : 'Crear ejercicio'">Guardar</button>
                    <a class="admin-back" th:href="@{/admin/ejercicios}">Cancelar</a>
                </div>
            </form>
        </main>
    </div>
</div>
<script defer th:src="@{/js/panel.js}"></script>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
