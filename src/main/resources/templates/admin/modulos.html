<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-head :: adminHead('Módulos')}"></head>

<body class="panel-body admin-body">
<a class="skip-link" href="#panel-main">Saltar al contenido</a>
<div class="panel admin">
    <aside th:replace="~{admin/fragments/admin-nav :: sidebar('modulos')}"></aside>
    <div class="panel-shell">
        <header th:replace="~{admin/fragments/admin-nav :: topbar('Módulos', 'Módulos por curso', ${query})}"></header>
        <main id="panel-main" class="panel-main admin-main">

            <div class="admin-page-head">
                <div><h1>Módulos</h1><p th:text="${page.totalElements == 1 ? '1 módulo' : page.totalElements + ' módulos'}">0 módulos</p></div>
                <div class="admin-actions">
                    <a class="btn btn-admin" th:href="@{/admin/modulos/nuevo}">Nuevo módulo</a>
                    <details class="admin-export"><summary>Exportar</summary><div class="panel-menu-pop">
                        <a th:href="@{/admin/exportar/modulos(formato='csv')}">CSV</a>
                        <a th:href="@{/admin/exportar/modulos(formato='xlsx')}">Excel (XLSX)</a>
                        <a th:href="@{/admin/exportar/modulos(formato='pdf')}">PDF</a>
                    </div></details>
                </div>
            </div>

            <form class="admin-filters admin-filters--full" method="get" th:action="@{/admin/modulos}">
                <label class="sr-only" for="filtro-modulos">Buscar módulos</label>
                <input id="filtro-modulos" name="q" type="search" th:value="${query}" placeholder="Título del módulo…">
                <label class="sr-only" for="filtro-curso">Filtrar por curso</label>
                <select id="filtro-curso" name="curso">
                    <option value="">Todos los cursos</option>
                    <option th:each="o : ${options}" th:value="${o.id()}" th:text="${o.label()}"
                            th:selected="${cursoId != null and cursoId.toString() == o.id().toString()}"></option>
                </select>
                <button class="btn btn-admin" type="submit">Filtrar</button>
            </form>

            <div class="panel-card admin-card admin-table-wrap">
                <table class="admin-table">
                    <caption>Módulos por curso</caption>
                    <thead><tr><th scope="col">Curso</th><th scope="col">Módulo</th><th scope="col">Pos.</th><th scope="col">Videos</th><th scope="col">Ejercicios</th><th scope="col">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${page.content}">
                        <td th:text="${item.cursoTitulo()}" th:title="${item.cursoTitulo()}">Curso</td>
                        <td th:title="${item.titulo()}"><strong th:text="${item.titulo()}">Módulo</strong></td>
                        <td th:text="${item.posicion()}">0</td>
                        <td th:text="${item.videos()}">0</td>
                        <td th:text="${item.exercises()}">0</td>
                        <td class="admin-row-actions">
                            <a th:href="@{/admin/modulos/{id}/editar(id=${item.id()})}"
                               th:attr="aria-label='Editar ' + ${item.titulo()}"><th:block th:replace="~{fragments/admin-icons :: pencil}"></th:block><span class="sr-only">Editar</span></a>
                            <form th:action="@{/admin/modulos/{id}/mover(id=${item.id()}, up=true)}" method="post">
                                <button class="admin-move" type="submit"
                                        th:attr="aria-label='Subir ' + ${item.titulo()}"><th:block th:replace="~{fragments/admin-icons :: arrowUp}"></th:block><span class="sr-only">Subir</span></button>
                            </form>
                            <form th:action="@{/admin/modulos/{id}/mover(id=${item.id()}, up=false)}" method="post">
                                <button class="admin-move" type="submit"
                                        th:attr="aria-label='Bajar ' + ${item.titulo()}"><th:block th:replace="~{fragments/admin-icons :: arrowDown}"></th:block><span class="sr-only">Bajar</span></button>
                            </form>
                            <button type="button" class="admin-confirm-link"
                                    th:attr="data-confirm-url=@{/admin/modulos/{id}/eliminar(id=${item.id()})}, aria-label='Eliminar ' + ${item.titulo()}"><th:block th:replace="~{fragments/admin-icons :: trash}"></th:block><span class="sr-only">Eliminar</span></button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.content)}"><td colspan="6" class="admin-empty">Sin módulos.</td></tr>
                    </tbody>
                </table>
            </div>
            <nav class="admin-pager" th:if="${page.totalPages > 1}" aria-label="Paginación de módulos">
                <a th:if="${!page.first}" th:href="@{/admin/modulos(page=${page.number - 1}, q=${query}, curso=${cursoId})}">← Anterior</a>
                <span th:text="${'Página ' + (page.number + 1) + ' de ' + page.totalPages}">Página 1</span>
                <a th:if="${!page.last}" th:href="@{/admin/modulos(page=${page.number + 1}, q=${query}, curso=${cursoId})}">Siguiente →</a>
            </nav>
        </main>
    </div>
</div>
<script defer th:src="@{/js/panel.js}"></script>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
