<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-head :: adminHead('Cargar cuestionario')}"></head>

<body class="panel-body admin-body">
<a class="skip-link" href="#panel-main">Saltar al contenido</a>
<div class="panel admin">
    <aside th:replace="~{admin/fragments/admin-nav :: sidebar('ejercicios')}"></aside>
    <div class="panel-shell">
        <header th:replace="~{admin/fragments/admin-nav :: topbar('Ejercicios', 'Cargar cuestionario', '')}"></header>
        <main id="panel-main" class="panel-main admin-main">
            <div class="admin-page-head">
                <div>
                    <h1>Cargar cuestionario</h1>
                    <p th:text="${ejercicioTitulo} ?: 'Ejercicio'">Ejercicio</p>
                </div>
                <a class="admin-back" th:href="@{/admin/ejercicios/{id}/editar(id=${itemId})}">← Volver al ejercicio</a>
            </div>

            <form class="admin-form" th:action="@{/admin/ejercicios/{id}/preguntas(id=${itemId})}"
                  th:object="${adminCuestionarioFormulario}" method="post" novalidate>
                <p class="admin-hint">Cargá diez preguntas con cuatro alternativas. Marcá la respuesta correcta de cada una. Cada acierto vale 2 puntos.</p>
                <p class="admin-error" role="alert" th:if="${#fields.hasErrors('questions')}" th:errors="*{questions}"></p>

                <section class="panel-card admin-card quiz-admin-question"
                         th:each="pregunta, i : ${adminCuestionarioFormulario.questions}">
                    <h2 th:text="${'Pregunta ' + (i.index + 1)}">Pregunta 1</h2>
                    <div class="admin-field">
                        <label th:for="|quiz-prompt-${i.index}|">Enunciado</label>
                        <textarea th:id="|quiz-prompt-${i.index}|" rows="2" maxlength="500" required
                                  th:field="*{questions[__${i.index}__].prompt}"
                                  th:attr="aria-invalid=${#fields.hasErrors('questions[__${i.index}__].prompt')} ? 'true' : null,
                                           aria-describedby=${#fields.hasErrors('questions[__${i.index}__].prompt')} ? |error-quiz-prompt-${i.index}| : null"></textarea>
                        <small class="admin-error" th:id="|error-quiz-prompt-${i.index}|"
                               th:if="${#fields.hasErrors('questions[__${i.index}__].prompt')}"
                               th:errors="*{questions[__${i.index}__].prompt}"></small>
                    </div>

                    <fieldset class="quiz-admin-alternatives">
                        <legend>Alternativas y respuesta correcta</legend>
                        <div class="quiz-admin-option"
                             th:each="alternativa, opcion : ${pregunta.alternatives}">
                            <input type="radio"
                                   th:field="*{questions[__${i.index}__].correctIndex}"
                                   th:value="${opcion.index + 1}"
                                   th:id="|quiz-correct-${i.index}-${opcion.index}|">
                            <label class="quiz-admin-correct-label"
                                   th:for="|quiz-correct-${i.index}-${opcion.index}|"
                                   th:text="${'Correcta ' + (opcion.index + 1)}">Correcta 1</label>
                            <label class="sr-only" th:for="|quiz-alternative-${i.index}-${opcion.index}|"
                                   th:text="${'Texto de la alternativa ' + (opcion.index + 1)}">Texto</label>
                            <input type="text" maxlength="300" required
                                   th:id="|quiz-alternative-${i.index}-${opcion.index}|"
                                   th:field="*{questions[__${i.index}__].alternatives[__${opcion.index}__].label}"
                                   th:attr="aria-invalid=${#fields.hasErrors('questions[__${i.index}__].alternatives[__${opcion.index}__].label')} ? 'true' : null">
                            <small class="admin-error"
                                   th:if="${#fields.hasErrors('questions[__${i.index}__].alternatives[__${opcion.index}__].label')}"
                                   th:errors="*{questions[__${i.index}__].alternatives[__${opcion.index}__].label}"></small>
                        </div>
                        <small class="admin-error"
                               th:if="${#fields.hasErrors('questions[__${i.index}__].correctIndex')}"
                               th:errors="*{questions[__${i.index}__].correctIndex}"></small>
                    </fieldset>
                </section>

                <div class="admin-form-actions">
                    <button class="btn btn-admin" type="submit">Guardar cuestionario</button>
                    <a class="admin-back" th:href="@{/admin/ejercicios/{id}/editar(id=${itemId})}">Cancelar</a>
                </div>
            </form>
        </main>
    </div>
</div>
<script defer th:src="@{/js/panel.js}"></script>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
