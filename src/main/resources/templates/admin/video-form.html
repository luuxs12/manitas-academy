<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-head :: adminHead(${itemId != null} ? 'Editar video' : 'Nuevo video')}"></head>

<body class="panel-body admin-body">
<a class="skip-link" href="#panel-main">Saltar al contenido</a>
<div class="panel admin">
    <aside th:replace="~{admin/fragments/admin-nav :: sidebar('videos')}"></aside>
    <div class="panel-shell">
        <header th:replace="~{admin/fragments/admin-nav :: topbar('Videos', ${itemId != null} ? 'Editar video' : 'Nuevo video', '')}"></header>
        <main id="panel-main" class="panel-main admin-main">
            <div class="admin-page-head">
                <div><h1 th:text="${itemId != null} ? 'Editar video' : 'Nuevo video'">Video</h1><p>Pegá el enlace público de YouTube.</p></div>
                <a class="admin-back" th:href="@{/admin/videos}">← Volver a videos</a>
            </div>
            <form class="panel-card admin-card admin-form" th:action="${itemId != null} ? @{/admin/videos/{id}(id=${itemId})} : @{/admin/videos}"
                  th:object="${adminVideoFormulario}" method="post" novalidate>
                <div class="admin-form-grid">
                    <div class="admin-field">
                        <label for="video-modulo">Módulo</label>
                        <select id="video-modulo" th:field="*{moduloId}" required
                                th:attr="aria-invalid=${#fields.hasErrors('moduloId')} ? 'true' : null,
                                         aria-describedby=${#fields.hasErrors('moduloId')} ? 'error-video-modulo' : null">
                            <option value="">Elegí un módulo</option>
                            <option th:each="o : ${options}" th:value="${o.id()}" th:text="${o.label()}"></option>
                        </select>
                        <small id="error-video-modulo" class="admin-error" th:if="${#fields.hasErrors('moduloId')}" th:errors="*{moduloId}"></small>
                    </div>
                    <div class="admin-field">
                        <label for="video-titulo">Título</label>
                        <input id="video-titulo" type="text" th:field="*{titulo}" maxlength="140" required
                               th:attr="aria-invalid=${#fields.hasErrors('titulo')} ? 'true' : null,
                                        aria-describedby=${#fields.hasErrors('titulo')} ? 'error-video-titulo' : null">
                        <small id="error-video-titulo" class="admin-error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></small>
                    </div>
                    <div class="admin-field admin-span-2">
                        <label for="video-youtube-url">Enlace de YouTube</label>
                        <input id="video-youtube-url" type="url" th:field="*{youtubeUrl}" maxlength="300" required
                               placeholder="https://www.youtube.com/watch?v=…"
                               th:attr="aria-invalid=${#fields.hasErrors('youtubeUrl')} ? 'true' : null,
                                        aria-describedby=${#fields.hasErrors('youtubeUrl')} ? 'hint-youtube error-video-youtube' : 'hint-youtube'">
                        <small id="hint-youtube" class="admin-hint">Se reproduce desde YouTube en modo sin cookies.</small>
                        <small id="error-video-youtube" class="admin-error" th:if="${#fields.hasErrors('youtubeUrl')}" th:errors="*{youtubeUrl}"></small>
                    </div>
                    <div class="admin-field">
                        <label for="video-posicion">Posición</label>
                        <input id="video-posicion" type="number" th:field="*{posicion}" min="0" max="9999"
                               th:attr="aria-invalid=${#fields.hasErrors('posicion')} ? 'true' : null,
                                        aria-describedby=${#fields.hasErrors('posicion')} ? 'error-video-posicion' : null">
                        <small id="error-video-posicion" class="admin-error" th:if="${#fields.hasErrors('posicion')}" th:errors="*{posicion}"></small>
                    </div>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-admin" type="submit" th:text="${itemId != null} ? 'Guardar cambios' : 'Crear video'">Guardar</button>
                    <a class="admin-back" th:href="@{/admin/videos}">Cancelar</a>
                </div>
            </form>
        </main>
    </div>
</div>
<script defer th:src="@{/js/panel.js}"></script>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
