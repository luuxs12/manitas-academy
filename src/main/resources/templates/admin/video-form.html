<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-head :: adminHead(${itemId != null} ? 'Editar video' : 'Nuevo video')}"></head>

<body class="panel-body admin-body">
<a class="skip-link" href="#panel-main">Saltar al contenido</a>
<div class="panel admin">
    <aside th:replace="~{admin/fragments/admin-nav :: sidebar('videos')}"></aside>
    <div class="panel-shell">
        <header th:replace="~{admin/fragments/admin-nav :: topbar('Videos', ${itemId != null} ? 'Editar video' : 'Nuevo video', '')}"></header>
        <main id="panel-main" class="panel-main admin-main">
            <p class="panel-flash panel-flash--error" th:if="${panelError}" th:text="${panelError}" role="alert"></p>
            <div class="admin-page-head">
                <div><h1 th:text="${itemId != null} ? 'Editar video' : 'Nuevo video'">Video</h1><p>Subí el video a R2 o indicá su clave privada. La URL queda solo para videos históricos.</p></div>
                <a class="admin-back" th:href="@{/admin/videos}">← Volver a videos</a>
            </div>
            <form class="panel-card admin-card admin-form" th:action="${itemId != null} ? @{/admin/videos/{id}(id=${itemId})} : @{/admin/videos}"
                  th:object="${adminVideoForm}" method="post" novalidate>
                <div class="admin-form-grid">
                    <label>Módulo
                        <select th:field="*{moduleId}" required>
                            <option value="">Elegí un módulo</option>
                            <option th:each="o : ${options}" th:value="${o.id()}" th:text="${o.label()}"></option>
                        </select>
                        <small class="admin-error" th:if="${#fields.hasErrors('moduleId')}" th:errors="*{moduleId}"></small>
                    </label>
                    <label>Título<input type="text" th:field="*{title}" maxlength="140" required>
                        <small class="admin-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></small></label>
                    <label class="admin-span-2">URL histórica (solo videos viejos)
                        <input id="video-url" type="text" th:field="*{url}" maxlength="300">
                        <small class="admin-error" th:if="${#fields.hasErrors('url')}" th:errors="*{url}"></small></label>
                    <label>Clave del video en R2
                        <input id="video-object-key" type="text" th:field="*{objectKey}" maxlength="300"
                               placeholder="videos/nombre.mp4">
                        <small class="admin-error" th:if="${#fields.hasErrors('objectKey')}" th:errors="*{objectKey}"></small></label>
                    <label>Clave del subtítulo VTT
                        <input id="video-subtitle-key" type="text" th:field="*{subtitleKey}" maxlength="300"
                               placeholder="subtitles/nombre.vtt">
                        <small class="admin-error" th:if="${#fields.hasErrors('subtitleKey')}" th:errors="*{subtitleKey}"></small></label>
                    <label>Duración (segundos)
                        <input type="number" th:field="*{durationSeconds}" min="0" max="86400" required>
                        <small class="admin-error" th:if="${#fields.hasErrors('durationSeconds')}" th:errors="*{durationSeconds}"></small></label>
                    <label>Posición<input type="number" th:field="*{position}" min="0" max="999"></label>
                    <label class="admin-span-2">Transcripción
                        <textarea th:field="*{transcript}" rows="4" maxlength="2000"
                                  placeholder="Texto plano de lo que se dice en el video."></textarea>
                        <small class="admin-error" th:if="${#fields.hasErrors('transcript')}" th:errors="*{transcript}"></small></label>
                </div>
                <div class="admin-upload" data-upload data-upload-target="#video-object-key" data-upload-field="key"
                     th:attr="data-upload-endpoint=@{/admin/archivos/videos}">
                    <label>Subir video al bucket privado
                        <input type="file" accept="video/mp4,video/webm,video/quicktime" data-upload-file>
                    </label>
                    <input type="hidden" data-upload-csrf th:value="${_csrf != null} ? ${_csrf.token} : ''">
                    <span class="admin-upload-status" data-upload-status>
                        Sin R2 configurado, podés pegar una clave o una URL existente.
                    </span>
                </div>
                <div class="admin-upload" data-upload data-upload-target="#video-subtitle-key" data-upload-field="key"
                     th:attr="data-upload-endpoint=@{/admin/archivos/subtitulos}">
                    <label>Subir subtítulo VTT en español
                        <input type="file" accept="text/vtt,.vtt" data-upload-file>
                    </label>
                    <input type="hidden" data-upload-csrf th:value="${_csrf != null} ? ${_csrf.token} : ''">
                    <span class="admin-upload-status" data-upload-status>
                        Opcional; un solo subtítulo en español por video.
                    </span>
                </div>
                <div class="admin-form-actions">
                    <button class="btn btn-admin" type="submit" th:text="${itemId != null} ? 'Guardar cambios' : 'Crear video'">Guardar</button>
                    <a class="admin-back" th:href="@{/admin/videos}">Cancelar</a>
                </div>
            </form>
        </main>
    </div>
</div>
<script defer th:src="@{/js/panel.js}"></script>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
