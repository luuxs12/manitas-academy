<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{admin/fragments/admin-head :: adminHead('Videos')}"></head>

<body class="panel-body admin-body">
<a class="skip-link" href="#panel-main">Saltar al contenido</a>
<div class="panel admin">
    <aside th:replace="~{admin/fragments/admin-nav :: sidebar('videos')}"></aside>
    <div class="panel-shell">
        <header th:replace="~{admin/fragments/admin-nav :: topbar('Videos', 'Material audiovisual por módulo', ${query})}"></header>
        <main id="panel-main" class="panel-main admin-main">

            <div class="admin-page-head">
                <div><h1>Gestión de videos</h1><p th:text="${page.totalElements + ' videos'}">0 videos</p></div>
                <div class="admin-actions">
                    <a class="btn btn-admin" th:href="@{/admin/videos/nuevo}">Nuevo video</a>
                    <details class="admin-export"><summary>Exportar</summary><div class="panel-menu-pop">
                        <a th:href="@{/admin/exportar/videos(formato='csv')}">CSV</a>
                        <a th:href="@{/admin/exportar/videos(formato='xlsx')}">Excel (XLSX)</a>
                        <a th:href="@{/admin/exportar/videos(formato='pdf')}">PDF</a>
                    </div></details>
                </div>
            </div>

            <form class="admin-filters admin-filters--full" method="get" th:action="@{/admin/videos}">
                <label class="sr-only" for="filtro-videos">Buscar videos</label>
                <input id="filtro-videos" name="q" type="search" th:value="${query}" placeholder="Título del video…">
                <label class="sr-only" for="filtro-modulo">Filtrar por módulo</label>
                <select id="filtro-modulo" name="modulo">
                    <option value="">Todos los módulos</option>
                    <option th:each="o : ${options}" th:value="${o.id()}" th:text="${o.label()}"
                            th:selected="${moduloId != null and moduloId.toString() == o.id().toString()}"></option>
                </select>
                <button class="btn btn-admin" type="submit">Filtrar</button>
            </form>

            <div class="panel-card admin-card admin-table-wrap">
                <table class="admin-table">
                    <caption>Clases de YouTube por módulo, con su posición en el temario.</caption>
                    <thead><tr><th scope="col">Video</th><th scope="col">Curso / Módulo</th><th scope="col">Origen</th><th scope="col">Pos.</th><th scope="col">Acciones</th></tr></thead>
                    <tbody>
                    <tr th:each="item : ${page.content}">
                        <td><strong th:text="${item.titulo()}">Video</strong></td>
                        <td><small th:text="${item.cursoTitulo()}">Curso</small><br><small th:text="${item.moduloTitulo()}">Módulo</small></td>
                        <td class="admin-url" th:text="${item.url()}">youtu.be/…</td>
                        <td th:text="${item.posicion()}">0</td>
                        <td class="admin-row-actions">
                            <a th:href="@{/admin/videos/{id}/editar(id=${item.id()})}">Editar</a>
                            <form th:action="@{/admin/videos/{id}/mover(id=${item.id()}, up=true)}" method="post">
                                <button type="submit" th:attr="aria-label='Subir ' + ${item.titulo()}">↑</button>
                            </form>
                            <form th:action="@{/admin/videos/{id}/mover(id=${item.id()}, up=false)}" method="post">
                                <button type="submit" th:attr="aria-label='Bajar ' + ${item.titulo()}">↓</button>
                            </form>
                            <button type="button" class="admin-confirm-link"
                                    th:attr="data-confirm-url=@{/admin/videos/{id}/eliminar(id=${item.id()})}, aria-label='Eliminar ' + ${item.titulo()}">Eliminar</button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.content)}"><td colspan="5" class="admin-empty">Todavía no hay videos cargados.</td></tr>
                    </tbody>
                </table>
            </div>
            <nav class="admin-pager" th:if="${page.totalPages > 1}" aria-label="Paginación de videos">
                <a th:if="${!page.first}" th:href="@{/admin/videos(page=${page.number - 1}, q=${query}, modulo=${moduloId})}">← Anterior</a>
                <span th:text="${'Página ' + (page.number + 1) + ' de ' + page.totalPages}">Página 1</span>
                <a th:if="${!page.last}" th:href="@{/admin/videos(page=${page.number + 1}, q=${query}, modulo=${moduloId})}">Siguiente →</a>
            </nav>
        </main>
    </div>
</div>
<script defer th:src="@{/js/panel.js}"></script>
<script defer th:src="@{/js/admin.js}"></script>
</body>
</html>
