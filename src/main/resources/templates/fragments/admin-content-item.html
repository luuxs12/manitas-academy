<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

<!-- Fila compartida por los ítems con sección y los sueltos del temario admin. -->
<li class="admin-content-item" th:fragment="row(item, section)">
    <div class="admin-content-copy">
        <div class="admin-content-top">
            <span class="admin-type" th:text="${item.type()}">VIDEO</span>
            <span class="admin-status"
                  th:classappend="${item.visible() and (seccion == null or seccion.visible())} ? ' is-ok' : ' is-bad'"
                  th:text="${item.visible() and (seccion == null or seccion.visible())} ? 'Visible' : 'Oculto'">Visible</span>
        </div>

        <strong th:text="${item.titulo()}">Ítem</strong>

        <small th:if="${item.descripcion() != null}" th:text="${item.descripcion()}">Descripción</small>
        <small th:if="${item.type() == 'MATERIAL' and item.url() != null}">
            <a th:href="${item.url()}" target="_blank" rel="noopener noreferrer"
               th:attr="aria-label='Abrir el enlace de ' + ${item.titulo()} + ' en pestaña nueva'"
               th:text="${item.url()}">Enlace</a>
        </small>
        <small th:if="${item.type() == 'VIDEO'}" th:text="${item.duracionLabel()}">Sin duración</small>
        <small th:if="${seccion == null}">Sin sección</small>
        <small th:if="${!item.visible() or (seccion != null and !seccion.visible())}">
            Oculto en el temario del estudiante
        </small>
    </div>

    <div class="admin-row-actions">
        <form method="post"
              th:action="@{/admin/cursos/{c}/contenido/items/{i}/mover(c=${cursoId},i=${item.id()})}">
            <input type="hidden" name="up" value="true">
            <button class="admin-move" type="submit"
                    th:attr="aria-label='Subir ' + ${item.titulo()}">↑</button>
        </form>
        <form method="post"
              th:action="@{/admin/cursos/{c}/contenido/items/{i}/mover(c=${cursoId},i=${item.id()})}">
            <input type="hidden" name="up" value="false">
            <button class="admin-move" type="submit"
                    th:attr="aria-label='Bajar ' + ${item.titulo()}">↓</button>
        </form>
        <button type="button" class="admin-confirm-link"
                th:attr="data-confirm-url=@{/admin/cursos/{c}/contenido/items/{i}/eliminar(c=${cursoId},i=${item.id()})}, aria-label='Eliminar ' + ${item.titulo()}">Eliminar</button>
    </div>
</li>

</body>
</html>
