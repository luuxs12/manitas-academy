<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<body>

<!-- Iconos de Lucide local. Se insertan con th:replace. -->
<i th:fragment="trash" class="ico" data-lucide="trash-2" aria-hidden="true"></i>
<!-- Estos dos trazos se conservan: una prueba valida sus rutas exactas. -->
<svg th:fragment="eye" class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6"></path>
    <circle cx="12" cy="12" r="2.5"></circle>
</svg>

<svg th:fragment="eyeOff" class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M3 3l18 18"></path>
    <path d="M10.6 6.2A10.6 10.6 0 0 1 12 6c6.5 0 10 6 10 6a16 16 0 0 1-3 3.5"></path>
    <path d="M6.4 8.2A16 16 0 0 0 2 12s3.5 6 10 6a10 10 0 0 0 3.2-.5"></path>
    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
</svg>
<i th:fragment="pencil" class="ico" data-lucide="pencil" aria-hidden="true"></i>
<i th:fragment="list" class="ico" data-lucide="list" aria-hidden="true"></i>
<i th:fragment="clipboard" class="ico" data-lucide="clipboard" aria-hidden="true"></i>
<i th:fragment="download" class="ico" data-lucide="download" aria-hidden="true"></i>
<i th:fragment="ban" class="ico" data-lucide="ban" aria-hidden="true"></i>
<i th:fragment="arrowUp" class="ico" data-lucide="arrow-up" aria-hidden="true"></i>
<i th:fragment="arrowDown" class="ico" data-lucide="arrow-down" aria-hidden="true"></i>
<i th:fragment="more" class="ico" data-lucide="ellipsis" aria-hidden="true"></i>
<i th:fragment="upload" class="ico" data-lucide="upload" aria-hidden="true"></i>
<i th:fragment="user" class="ico" data-lucide="user" aria-hidden="true"></i>
<i th:fragment="logout" class="ico" data-lucide="log-out" aria-hidden="true"></i>
<i th:fragment="camera" class="ico" data-lucide="camera" aria-hidden="true"></i>

</body>
</html>
