<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/panel-head :: panelHead('Certificado')}"></head>

<body class="certificate-body">
<a class="skip-link" href="#contenido">Saltar al contenido</a>

<main id="contenido" class="certificate-page">
    <nav class="certificate-actions" aria-label="Acciones del certificado">
        <a th:href="@{/panel/certificados}">← Volver a certificados</a>
        <button type="button" class="btn btn-dark" data-print>Imprimir o guardar en PDF</button>
    </nav>

    <div th:replace="~{fragments/certificate-document :: document(${account.fullName}, ${certificate.courseTitle()}, ${certificate.videoCount()}, ${certificate.issuedAt()}, ${certificate.code()})}"></div>
</main>

<script defer th:src="@{/js/panel.js}"></script>
</body>
</html>
