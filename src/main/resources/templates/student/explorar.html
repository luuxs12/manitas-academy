<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/panel-head :: panelHead('Inscribirme a cursos')}"></head>

<body class="panel-body">
<a class="skip-link" href="#contenido">Saltar al contenido</a>

<div class="panel">
    <aside th:replace="~{fragments/panel-nav :: sidebar('explorar')}"></aside>

    <div class="panel-shell">
        <header th:replace="~{fragments/panel-nav :: topbar(${query})}"></header>

        <main id="contenido" class="panel-main">
            <div class="panel-page-head">
                <div>
                    <p class="panel-eyebrow">Catálogo del panel</p>
                    <h1>Inscribirme a cursos</h1>
                    <p>Buscá y sumá cursos aquí.</p>
                </div>
                <a class="panel-plan panel-plan--link"
                   th:href="@{/panel/facturacion}"
                   th:text="${'Tu plan: ' + usuarioActual.planLabel()}">Tu plan: Gratis</a>
            </div>


            <form class="panel-explore-search" role="search" th:action="@{/panel/explorar}" method="get">
                <label class="sr-only" for="explorar-buscar">Buscar cursos</label>
                <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="11" cy="11" r="6.5"></circle>
                    <path d="m16 16 4.5 4.5"></path>
                </svg>
                <input id="explorar-buscar" name="q" type="search" th:value="${query}"
                       placeholder="Nombre, área o nivel…" autocomplete="off">
                <button class="btn btn-dark" type="submit">Buscar</button>
            </form>

            <nav class="panel-filters" aria-label="Filtrar por área">
                <a th:href="@{/panel/explorar}"
                   th:classappend="${#strings.isEmpty(query)} ? 'is-active' : ''">Todos</a>
                <a th:each="area : ${areas}"
                   th:href="@{/panel/explorar(q=${area})}"
                   th:text="${area}"
                   th:classappend="${#strings.equalsIgnoreCase(query, area)} ? 'is-active' : ''">Área</a>
            </nav>

            <p class="catalog-count" th:if="${!#strings.isEmpty(query)}">
                <span th:text="${#lists.size(courses)}">0</span> resultados para
                «<span th:text="${query}">…</span>»
                <a th:href="@{/panel/explorar}">Limpiar</a>
            </p>

            <section class="panel-section" aria-labelledby="titulo-catalogo">
                <div class="panel-section-head">
                    <h2 id="titulo-catalogo">Catálogo</h2>
                    <span class="panel-rule" aria-hidden="true"></span>
                </div>

                <div class="panel-course-grid" th:if="${!#lists.isEmpty(courses)}">
                    <article class="panel-course" th:each="curso : ${courses}">
                        <img th:src="${!#strings.isEmpty(curso.imagen) ? curso.imagen : '/img/course-placeholder.svg'}" alt="" width="960" height="600" loading="lazy">
                        <div class="panel-course-body">
                            <h3 th:text="${curso.titulo}"></h3>
                            <span class="panel-chip" th:text="${curso.categoria}"></span>
                            <p class="panel-course-summary" th:text="${curso.resumen}"></p>
                            <p class="panel-course-meta">
                                <span th:text="${curso.nivel}"></span>
                                ·
                                <span th:text="${curso.lessons} + ' lecciones'"></span>
                            </p>

                            <div class="panel-course-foot">
                                <span class="panel-course-percent" th:text="${curso.priceLabel()}"></span>
                                <span class="panel-course-status is-done"
                                      th:if="${inscriptoSlugs.contains(curso.slug)}">Ya inscripto</span>
                            </div>

                            <form class="panel-enroll-form"
                                  th:if="${!inscriptoSlugs.contains(curso.slug) and (curso.free or usuarioActual.premium())}"
                                  th:action="@{/panel/cursos/{slug}/inscribir(slug=${curso.slug})}"
                                  method="post" data-confirm-form
                                  th:attr="data-confirm-message='¿Inscribirte en ' + ${curso.titulo} + '?'">
                                <button class="btn btn-dark panel-enroll-btn" type="submit">
                                    Inscribirme <span aria-hidden="true">→</span>
                                </button>
                            </form>

                            <a class="panel-inline-btn panel-locked"
                               th:if="${!inscriptoSlugs.contains(curso.slug) and !curso.free and !usuarioActual.premium()}"
                               th:href="@{/panel/facturacion}">
                                Requiere plan Premium →
                            </a>
                        </div>
                    </article>
                </div>

                <div class="panel-empty" th:if="${#lists.isEmpty(courses)}">
                    <span class="panel-empty-icon" aria-hidden="true">
                        <svg class="ico" viewBox="0 0 24 24" focusable="false">
                            <circle cx="11" cy="11" r="6.5"></circle>
                            <path d="m16 16 4.5 4.5"></path>
                        </svg>
                    </span>
                    <div>
                        <h3>No encontramos cursos</h3>
                        <p>Probá otra búsqueda.</p>
                    </div>
                    <a class="btn btn-ghost" th:href="@{/panel/explorar}">Ver todos</a>
                </div>
            </section>
        </main>
    </div>
</div>

<script defer th:src="@{/js/panel.js}"></script>
</body>
</html>
